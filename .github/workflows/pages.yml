name: Deploy Waves Digital Launch without Configure

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-diagnostic
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build certified static release
        run: node scripts/build.mjs
      - name: Verify generated release
        run: |
          test -f public/index.html
          test -f public/sitemap.xml
          test -f public/robots.txt
          test "$(find public -name index.html | wc -l | tr -d ' ')" -eq 71
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

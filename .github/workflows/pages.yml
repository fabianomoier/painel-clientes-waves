name: Validate Waves Digital Launch

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build certified static release
        run: node scripts/build.mjs
      - name: Verify generated release
        run: |
          test -f public/index.html
          test -f public/sitemap.xml
          test -f public/robots.txt
          find public -name index.html | wc -l
